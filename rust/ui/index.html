<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GDP Rust Runtime</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="layout">

      <!-- Hero -->
      <section class="panel hero">
        <p class="eyebrow">Rust-first runtime</p>
        <h1>GitHub Desktop Plus 低内存架构</h1>
        <p class="subtitle">
          目标：Node.js 退出运行时核心，常驻内存控制在 &lt; 10&nbsp;MB。
        </p>
      </section>

      <!-- Runtime stats -->
      <section class="panel stats">
        <div>
          <span class="label">内存目标</span>
          <strong id="memory-target">-</strong>
        </div>
        <div>
          <span class="label">核心运行时</span>
          <strong id="runtime">-</strong>
        </div>
        <div>
          <span class="label">UI 方案</span>
          <strong id="ui-strategy">-</strong>
        </div>
      </section>

      <!-- Configuration -->
      <section class="panel">
        <h2>配置 <span id="save-status" class="save-status"></span></h2>
        <div class="config-grid">
          <label class="toggle-row">
            <span class="toggle-label">禁用自动更新</span>
            <input type="checkbox" id="cfg-updates-disabled" />
          </label>
          <label class="toggle-row">
            <span class="toggle-label">屏蔽遥测上报</span>
            <input type="checkbox" id="cfg-telemetry-disabled" />
          </label>
          <label class="toggle-row">
            <span class="toggle-label">启用中文界面 (i18n)</span>
            <input type="checkbox" id="cfg-i18n-enabled" />
          </label>
          <label class="toggle-row">
            <span class="toggle-label">禁用文件日志</span>
            <input type="checkbox" id="cfg-disable-filelog" />
          </label>
        </div>
        <div class="action-row">
          <span id="detect-path" class="detect-info">— 尚未检测</span>
          <button id="detect-btn" class="btn" type="button">检测 Desktop</button>
          <button id="save-btn"   class="btn primary" type="button">保存配置</button>
        </div>
      </section>

      <!-- Module responsibilities -->
      <section class="panel">
        <h2>模块职责</h2>
        <ul id="modules" class="module-list"></ul>
      </section>

      <!-- Directory tree -->
      <section class="panel">
        <h2>推荐目录结构</h2>
        <pre id="tree"></pre>
      </section>

      <!-- Locale Editor -->
      <section class="panel" id="locale-panel">
        <h2>语言翻译编辑 <span id="locale-save-status" class="save-status"></span></h2>
        <div class="action-row">
          <select id="locale-select" class="locale-select"></select>
          <select id="category-select" class="locale-select">
            <option value="menu">菜单 (menu)</option>
            <option value="ui">界面 (ui)</option>
          </select>
          <input id="locale-search" class="locale-search" type="search" placeholder="搜索键名或翻译…" />
          <button id="locale-load-btn" class="btn" type="button">加载</button>
          <button id="locale-save-btn" class="btn primary" type="button">保存</button>
        </div>
        <div id="locale-editor-container" class="locale-editor-wrap"></div>
      </section>

    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
