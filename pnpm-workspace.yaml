  '@tailwindcss/vite': ^4.3.3
  '@types/node': ^22.20.1
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^6.1.1
  chokidar: ^5.0.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  execa: ^10.0.1
  jsonc-parser: ^3.3.1
  lucide-react: 1.36.0
  react: ^19.2.0
  react-dom: ^19.2.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.3.3
  tsdown: ^0.22.14
  tsx: ^4.23.12
  typescript: ^6.0.3
  vite: ^8.2.2

catalogMode: strict
catalogPrune: true
disallowWorkspaceCycles: true
