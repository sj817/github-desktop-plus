[workspace]
members = [
  "src/core",
  "src/gdp",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
bytes = { version = "1.10.1", default-features = false, features = ["std"] }
clap = { version = "4.5.38", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
http-body-util = "0.1.3"
hyper = { version = "1.6.0", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1.11", default-features = false, features = ["server", "http1", "tokio"] }
serde = { version = "1.0.219", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.140", default-features = false, features = ["std"] }
tokio = { version = "1.44.2", default-features = false, features = ["macros", "rt", "net", "process", "io-util", "fs", "signal", "time"] }
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false