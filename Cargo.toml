[workspace]
members = [
  "crates/gdp-core",
  "crates/wsl-agent",
  "apps/gdp",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.2.4"

[workspace.dependencies]
clap = { version = "4.5.38", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
serde = { version = "1.0.219", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.140", default-features = false, features = ["std"] }
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
libc = "0.2"
velopack = { version = "1.2.0", default-features = false }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false
