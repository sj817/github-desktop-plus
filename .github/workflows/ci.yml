name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Check WSL installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Bash syntax
        run: bash -n install.sh

      - name: Check installer help
        run: bash install.sh --help

      - name: Check piped installer
        run: bash scripts/checks/installer-pipe.sh

  wsl-agent:
    name: Build WSL agent (Linux x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - name: Test WSL agent
        run: cargo test -p gdp-wsl-agent

      - name: Build WSL agent
        run: cargo build --release --target x86_64-unknown-linux-musl -p gdp-wsl-agent

      - name: Verify WSL agent
        run: target/x86_64-unknown-linux-musl/release/gdp-wsl-agent --version

      - name: Upload WSL agent
        uses: actions/upload-artifact@v4
        with:
          name: gdp-wsl-agent-x86_64
          path: target/x86_64-unknown-linux-musl/release/gdp-wsl-agent
          retention-days: 14

  build:
    name: Check + Build (Windows)
    runs-on: windows-latest
    needs: wsl-agent
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Download WSL agent
        uses: actions/download-artifact@v4
        with:
          name: gdp-wsl-agent-x86_64
          path: target/wsl-agent/x86_64-unknown-linux-gnu/release

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript, packages, tests, formatting, and Rust
        run: pnpm run check

      - name: Rust build (release)
        if: github.ref == 'refs/heads/main'
        run: cargo build --release -p gdp

      - name: Verify gdp.exe
        if: github.ref == 'refs/heads/main'
        run: target/release/gdp.exe --version

      - name: Install Inno Setup 7.1.0
        if: github.ref == 'refs/heads/main'
        run: winget install --id JRSoftware.InnoSetup.7 --exact --version 7.1.0 --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity

      - name: Build community installer, MSI, and update assets
        if: github.ref == 'refs/heads/main'
        run: pnpm exec tsx scripts/package-windows.ts

      - name: Upload Windows package artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: github-desktop-plus-windows
          path: target/velopack/releases/*
          retention-days: 14
