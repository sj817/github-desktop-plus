name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wsl-agent:
    name: Build WSL agent (Linux x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Test WSL agent
        run: cargo test -p gdp-wsl-agent

      - name: Build WSL agent
        run: cargo build --release -p gdp-wsl-agent

      - name: Upload WSL agent
        uses: actions/upload-artifact@v4
        with:
          name: gdp-wsl-agent-x86_64
          path: target/release/gdp-wsl-agent
          retention-days: 14

  build:
    name: Check + Build (Windows)
    runs-on: windows-latest
    needs: wsl-agent
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Download WSL agent
        uses: actions/download-artifact@v4
        with:
          name: gdp-wsl-agent-x86_64
          path: target/wsl-agent/x86_64-unknown-linux-gnu/release

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript, packages, tests, formatting, and Rust
        run: pnpm run check

      - name: Rust build (release)
        if: github.ref == 'refs/heads/main'
        run: cargo build --workspace --release

      - name: Upload gdp.exe artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: gdp-windows-x64
          path: target/release/gdp.exe
          retention-days: 14
