name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: Build release (macOS ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify release tag
        run: pnpm exec tsx scripts/checks/version.ts "$GITHUB_REF_NAME"
      - name: Check source and tests
        run: pnpm run check
      - name: Build and package macOS app
        run: pnpm run package:macos
      - uses: actions/upload-artifact@v4
        with:
          name: github-desktop-plus-${{ github.ref_name }}-mac-${{ matrix.arch }}
          path: target/macos/releases/*
          if-no-files-found: error

  wsl-agent:
    name: Build WSL agent (Linux x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - name: Test WSL agent
        run: cargo test -p gdp-wsl-agent

      - name: Build static WSL agent
        run: cargo build --release --target x86_64-unknown-linux-musl -p gdp-wsl-agent

      - name: Verify WSL agent
        run: target/x86_64-unknown-linux-musl/release/gdp-wsl-agent --version

      - uses: actions/upload-artifact@v4
        with:
          name: gdp-wsl-agent-x86_64
          path: target/x86_64-unknown-linux-musl/release/gdp-wsl-agent
          if-no-files-found: error

  windows:
    name: Build release (Windows x64)
    runs-on: windows-latest
    needs: wsl-agent
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: actions/download-artifact@v4
        with:
          name: gdp-wsl-agent-x86_64
          path: target/wsl-agent/x86_64-unknown-linux-gnu/release

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: pnpm exec tsx scripts/checks/version.ts $env:RELEASE_TAG

      - name: Check source and tests
        run: pnpm run check

      - name: Build gdp.exe
        run: cargo build --release -p gdp

      - name: Verify binary version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $expected = "gdp $($env:RELEASE_TAG.Substring(1))"
          $actual = (& target/release/gdp.exe --version).Trim()
          if ($actual -ne $expected) {
            throw "Expected '$expected', got '$actual'"
          }

      - name: Install Inno Setup 7.1.0
        run: ./scripts/install-inno.ps1

      - name: Build community installer, MSI, and update assets
        shell: pwsh
        run: pnpm exec tsx scripts/package-windows.ts

      - uses: actions/upload-artifact@v4
        with:
          name: github-desktop-plus-${{ github.ref_name }}
          path: target/velopack/releases/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [windows, macos]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: github-desktop-plus-${{ github.ref_name }}*
          merge-multiple: true
          path: release

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            release/GitHubDesktopPlus-win-x64-Setup.exe
            release/GitHubDesktopPlus-win-x64-Portable.zip
            release/SHA256SUMS.txt
            release/GitHubDesktopPlus-mac-arm64.dmg
            release/GitHubDesktopPlus-mac-arm64.zip
            release/GitHubDesktopPlus-mac-x64.dmg
            release/GitHubDesktopPlus-mac-x64.zip
            release/SHA256SUMS-mac-arm64.txt
            release/SHA256SUMS-mac-x64.txt
          )
          for asset in "${assets[@]}"; do
            test -s "$asset" || { echo "Missing public asset: $asset"; exit 1; }
          done
          (cd release && sha256sum --check SHA256SUMS*.txt)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "GitHub Desktop Plus $GITHUB_REF_NAME" \
              --generate-notes
          fi
