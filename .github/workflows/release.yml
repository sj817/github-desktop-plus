name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wsl-agent:
    name: Build WSL agent (Linux x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - name: Test WSL agent
        run: cargo test -p gdp-wsl-agent

      - name: Build static WSL agent
        run: cargo build --release --target x86_64-unknown-linux-musl -p gdp-wsl-agent

      - name: Verify WSL agent
        run: target/x86_64-unknown-linux-musl/release/gdp-wsl-agent --version

      - uses: actions/upload-artifact@v4
        with:
          name: gdp-wsl-agent-x86_64
          path: target/x86_64-unknown-linux-musl/release/gdp-wsl-agent
          if-no-files-found: error

  windows:
    name: Build release (Windows x64)
    runs-on: windows-latest
    needs: wsl-agent
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: actions/download-artifact@v4
        with:
          name: gdp-wsl-agent-x86_64
          path: target/wsl-agent/x86_64-unknown-linux-gnu/release

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: pnpm run version:check -- $env:RELEASE_TAG

      - name: Check source and tests
        run: pnpm run check

      - name: Build gdp.exe
        run: cargo build --release -p gdp

      - name: Verify binary version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $expected = "gdp $($env:RELEASE_TAG.Substring(1))"
          $actual = (& target/release/gdp.exe --version).Trim()
          if ($actual -ne $expected) {
            throw "Expected '$expected', got '$actual'"
          }

      - name: Prepare release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $asset = 'gdp-windows-x64.exe'
          Copy-Item target/release/gdp.exe "release/$asset"
          $hash = (Get-FileHash "release/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content "release/$asset.sha256" -Encoding ascii
          Copy-Item install.sh release/install.sh

      - uses: actions/upload-artifact@v4
        with:
          name: github-desktop-plus-${{ github.ref_name }}
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: windows
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: github-desktop-plus-${{ github.ref_name }}
          path: release

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "GitHub Desktop Plus $GITHUB_REF_NAME" \
              --generate-notes
          fi
