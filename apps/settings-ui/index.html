<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GDP 设置（开发）</title>
    <link rel="icon" type="image/png" href="/src/assets/logo.png" />
    <style>
      @font-face {
        font-family: 'MiSans';
        src: url('/src/assets/fonts/MiSans-Normal.ttf') format('truetype');
        font-weight: 100 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'MiSans';
        src: url('/src/assets/fonts/MiSans-Medium.ttf') format('truetype');
        font-weight: 500 900;
        font-style: normal;
        font-display: swap;
      }
      /* The iframe is the whole viewport; production mounts into a sized box. */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: transparent;
      }
      #gdp-settings-root {
        height: 100%;
      }

      /* `?mock=1`: stand the root in a box shaped like the production dialog. */
      body.gdp-mock {
        display: grid;
        place-items: center;
        background: #e8ebf1;
        font-family: system-ui, sans-serif;
      }
      body.gdp-mock.dark {
        background: #08090c;
      }
      body.gdp-mock #gdp-settings-root {
        width: 1000px;
        max-width: 96vw;
        height: 720px;
        max-height: 92vh;
        border-radius: 28px;
        border: 1px solid rgba(127, 137, 149, 0.35);
        box-shadow:
          0 16px 48px -12px rgba(0, 0, 0, 0.28),
          0 4px 12px -4px rgba(0, 0, 0, 0.12);
      }
    </style>
  </head>
  <body>
    <div id="gdp-settings-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
