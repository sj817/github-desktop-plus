[package]
name = "gdp"
edition.workspace = true
license.workspace = true
version.workspace = true
build = "build.rs"

[[bin]]
name = "gdp"
path = "src/main.rs"

[dependencies]
gdp-core        = { path = "../../crates/gdp-core" }
clap.workspace           = true
serde.workspace          = true
serde_json.workspace     = true
tungstenite.workspace    = true
velopack.workspace       = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_System_Threading", "Win32_Foundation"] }

[build-dependencies]
serde_json.workspace = true
